global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: meeting-room-booking
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - api-gateway:8080
          - reference-service:8081
          - booking-service:8082
          - notification-service:8083
          - integration-service:8084
