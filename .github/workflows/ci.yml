name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: hadolint
        run: docker run --rm -i hadolint/hadolint:v2.12.0 hadolint --failure-threshold warning - < Dockerfile

  build-test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Build and test
        run: mvn -B verify
      - name: Coverage summary
        if: always()
        run: |
          for csv in */target/site/jacoco/jacoco.csv; do
            [ -f "$csv" ] || continue
            awk -F, -v m="$(dirname "$(dirname "$(dirname "$csv")")")" 'NR>1 {miss+=$8; cov+=$9} END {if (miss+cov>0) printf "%s - line coverage %.1f%% (%d of %d)\n", m, 100*cov/(miss+cov), cov, miss+cov}' "$csv" | tee -a "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/
            **/target/site/jacoco/

  scan-deps:
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy fs
        run: |
          T="docker run --rm -v $PWD:/src -v $HOME/.cache/trivy:/root/.cache/trivy aquasec/trivy:0.58.1"
          # отчёт для артефакта (без падения), затем таблица в лог с кодом возврата
          $T fs --ignorefile /src/.trivyignore --scanners vuln,secret,misconfig --severity HIGH,CRITICAL --ignore-unfixed \
            --format sarif --output /src/trivy-fs.sarif /src
          $T fs --ignorefile /src/.trivyignore --scanners vuln,secret,misconfig --severity HIGH,CRITICAL --ignore-unfixed \
            --format table --exit-code 1 /src
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-fs-report
          path: trivy-fs.sarif

  images:
    needs: scan-deps
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { service: reference-service, port: "8081" }
          - { service: booking-service, port: "8082" }
          - { service: notification-service, port: "8083" }
          - { service: integration-service, port: "8084" }
          - { service: api-gateway, port: "8080" }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Lowercase image path
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.service }}" >> "$GITHUB_ENV"
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          build-args: |
            SERVICE=${{ matrix.service }}
            PORT=${{ matrix.port }}
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - name: Image size
        run: |
          docker image ls "$IMAGE" --format '${{ matrix.service }} image size - {{.Size}}' | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Trivy image
        run: |
          T="docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v $PWD:/out -v $HOME/.cache/trivy:/root/.cache/trivy aquasec/trivy:0.58.1"
          $T image --ignorefile /out/.trivyignore --severity HIGH,CRITICAL --ignore-unfixed \
            --format sarif --output /out/trivy-${{ matrix.service }}.sarif "$IMAGE:${{ github.sha }}"
          $T image --ignorefile /out/.trivyignore --severity HIGH,CRITICAL --ignore-unfixed \
            --format table --exit-code 1 "$IMAGE:${{ github.sha }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-${{ matrix.service }}
          path: trivy-${{ matrix.service }}.sarif
      - name: Login to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          docker tag "$IMAGE:${{ github.sha }}" "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"